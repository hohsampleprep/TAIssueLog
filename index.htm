<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hohenstein Sample Preparation Team Test Assignment Issue Log</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <div class="max-w-3xl mx-auto mt-6 px-4">
    <header class="bg-indigo-900 text-white rounded-xl p-6 shadow-md mb-6">
      <h1 class="text-2xl font-bold tracking-tight">Hohenstein Sample Preparation Team</h1>
      <p class="text-indigo-200 text-sm mt-1">Test Assignment Issue Log</p>
    </header>

    <div class="bg-white rounded-xl shadow-md p-6 mb-6">
      <form id="issueForm" class="space-y-6" onsubmit="saveIssue(event)">
        
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Category</label>
          <div class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer border rounded-lg px-4 py-2 hover:bg-slate-50 border-slate-300 flex-1 justify-center font-medium">
              <input type="radio" name="category" value="HG" required class="accent-indigo-600" /> HG
            </label>
            <label class="flex items-center gap-2 cursor-pointer border rounded-lg px-4 py-2 hover:bg-slate-50 border-slate-300 flex-1 justify-center font-medium">
              <input type="radio" name="category" value="TX" class="accent-indigo-600" /> TX
            </label>
          </div>
        </div>

        <div class="border-2 border-dashed border-indigo-200 rounded-xl p-4 bg-indigo-50/40 text-center">
          <label class="block text-sm font-semibold text-indigo-950 mb-1">Scan Test Assignment (TA) Sheet</label>
          <p class="text-xs text-slate-500 mb-3">Upload or capture photo. The scanner auto-detects rotation and handwritten/printed reference numbers.</p>
          
          <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
          
          <div class="flex justify-center gap-2 flex-wrap">
            <button type="button" onclick="startLiveCamera('ocr')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-medium transition shadow-sm">
              📷 Open Live Camera
            </button>
            <button type="button" onclick="document.getElementById('cameraInput').click()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-medium transition shadow-sm">
              📁 Choose Photo File
            </button>
          </div>

          <div id="ocrStatus" class="mt-3 text-xs font-semibold text-indigo-700 hidden">
            <span id="ocrStatusText">Preparing image scanner...</span>
          </div>

          <div id="imagePreviewContainer" class="mt-3 hidden space-y-3">
            <div class="flex justify-center items-center overflow-hidden p-2 bg-slate-200 rounded-lg max-h-64">
              <img id="imagePreview" class="max-h-56 object-contain rounded transition-transform duration-200" alt="TA Sheet Preview" />
            </div>
            
            <div class="flex justify-center gap-2">
              <button type="button" onclick="rotatePreviewManual()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow-sm">
                🔄 Manual Rotate 90°
              </button>
              <button type="button" onclick="triggerScanCurrentOrientation()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow-sm">
                🔍 Rescan Photo
              </button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="ianRefNo" class="block text-sm font-medium text-slate-700 mb-1">IAN / HK Ref No. (e.g. 20260827-009)</label>
            <input type="text" id="ianRefNo" placeholder="Auto-extracted or enter manually" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
          <div>
            <label for="reportNo" class="block text-sm font-medium text-slate-700 mb-1">Report No. / LIMS No. (e.g. 26.0039656)</label>
            <input type="text" id="reportNo" placeholder="Auto-extracted or enter manually" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Select Identified Issues</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <label class="flex items-center gap-2 p-2.5 border rounded-lg border-slate-200 hover:bg-slate-50 cursor-pointer text-sm">
              <input type="checkbox" name="issues" value="Typo" class="rounded text-indigo-600 h-4 w-4" /> Typo
            </label>
            <label class="flex items-center gap-2 p-2.5 border rounded-lg border-slate-200 hover:bg-slate-50 cursor-pointer text-sm">
              <input type="checkbox" name="issues" value="Incorrect information provided" class="rounded text-indigo-600 h-4 w-4" /> Incorrect information provided
            </label>
            <label class="flex items-center gap-2 p-2.5 border rounded-lg border-slate-200 hover:bg-slate-50 cursor-pointer text-sm">
              <input type="checkbox" name="issues" value="Misuse of column" class="rounded text-indigo-600 h-4 w-4" /> Misuse of column
            </label>
            <label class="flex items-center gap-2 p-2.5 border rounded-lg border-slate-200 hover:bg-slate-50 cursor-pointer text-sm">
              <input type="checkbox" name="issues" value="Missing information" class="rounded text-indigo-600 h-4 w-4" /> Missing information
            </label>
          </div>
        </div>

        <div class="border border-slate-200 rounded-xl p-4 bg-slate-50">
          <label class="block text-sm font-semibold text-slate-700 mb-1">Issue Location Photo Reference</label>
          <p class="text-xs text-slate-500 mb-3">Attach a photo capturing the issue location on the document.</p>
          
          <input type="file" id="locationImageInput" accept="image/*" capture="environment" class="hidden" onchange="handleLocationImageUpload(event)">
          
          <div class="flex items-center gap-2 flex-wrap">
            <button type="button" onclick="startLiveCamera('location')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium shadow-sm">
              📸 Capture Location Photo
            </button>
            <button type="button" onclick="document.getElementById('locationImageInput').click()" class="bg-slate-600 hover:bg-slate-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium shadow-sm">
              📁 Upload File
            </button>
            <span id="locationPhotoName" class="text-xs text-slate-500 italic">No photo attached</span>
          </div>
          
          <div id="locationPreviewContainer" class="mt-3 hidden">
            <img id="locationPreview" class="max-h-36 rounded-md shadow border" alt="Location Preview" />
          </div>
        </div>

        <div>
          <label for="remarks" class="block text-sm font-medium text-slate-700 mb-1">Additional Remarks</label>
          <textarea id="remarks" rows="2" placeholder="Specify details about the issue location..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-medium py-2.5 rounded-lg transition shadow">
          Submit Log Entry
        </button>
      </form>
    </div>
  </div>

  <div id="cameraModal" class="fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl overflow-hidden max-w-md w-full p-4 flex flex-col items-center">
      <video id="videoFeed" autoplay playsinline class="w-full h-64 bg-black rounded-lg object-cover mb-4"></video>
      <canvas id="canvas" class="hidden"></canvas>
      <div class="flex gap-4">
        <button onclick="captureFromCamera()" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-medium text-sm">Snap Photo</button>
        <button onclick="closeCameraModal()" class="bg-slate-500 text-white px-4 py-2 rounded-lg font-medium text-sm">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://docs.google.com/spreadsheets/d/1eQ0KaOkuUiV3eS2DX_xiHQ991CTVQEWQfOsNBCGG9bw/edit?usp=sharing";
    let locationPhotoBase64 = "";
    let currentCameraTarget = ""; 
    let mediaStream = null;
    let manualRotationAngle = 0;
    let rawLoadedImage = null;

    // Handle File Upload
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          rawLoadedImage = img;
          manualRotationAngle = 0;
          document.getElementById("imagePreview").src = e.target.result;
          document.getElementById("imagePreview").style.transform = "rotate(0deg)";
          document.getElementById("imagePreviewContainer").classList.remove("hidden");
          
          autoScanAllOrientations(img);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Preprocess image to high-contrast grayscale for improved OCR read
    function renderEnhancedCanvas(imgElement, rotationAngle) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      if (rotationAngle === 90 || rotationAngle === 270) {
        canvas.width = imgElement.naturalHeight || imgElement.height;
        canvas.height = imgElement.naturalWidth || imgElement.width;
      } else {
        canvas.width = imgElement.naturalWidth || imgElement.width;
        canvas.height = imgElement.naturalHeight || imgElement.height;
      }

      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((rotationAngle * Math.PI) / 180);
      ctx.filter = "contrast(180%) grayscale(100%) brightness(105%)";
      ctx.drawImage(imgElement, -imgElement.naturalWidth / 2, -imgElement.naturalHeight / 2);

      return canvas;
    }

    // Automatic multi-angle OCR scanner (0°, 90°, 180°, 270°)
    async function autoScanAllOrientations(imgElement) {
      const status = document.getElementById("ocrStatus");
      const statusText = document.getElementById("ocrStatusText");
      status.classList.remove("hidden");

      const angles = [0, 90, 270, 180];
      let extractedLims = "";
      let extractedRef = "";

      for (let i = 0; i < angles.length; i++) {
        const angle = angles[i];
        statusText.innerText = `Scanning orientation (${i+1}/4 - ${angle}°)...`;
        
        const enhancedCanvas = renderEnhancedCanvas(imgElement, angle);
        const dataUrl = enhancedCanvas.toDataURL("image/jpeg", 0.9);

        try {
          const { data: { text } } = await Tesseract.recognize(dataUrl, 'eng');
          const result = parseOCRText(text);

          if (result.lims) extractedLims = result.lims;
          if (result.ref) extractedRef = result.ref;

          // If both numbers found, break early and auto-adjust visual preview rotation
          if (extractedLims && extractedRef) {
            manualRotationAngle = angle;
            document.getElementById("imagePreview").style.transform = `rotate(${angle}deg)`;
            break;
          }
        } catch (err) {
          console.error("OCR angle scan error:", err);
        }
      }

      // Populate input fields
      if (extractedLims) document.getElementById("reportNo").value = extractedLims;
      if (extractedRef) document.getElementById("ianRefNo").value = extractedRef;

      if (extractedLims || extractedRef) {
        statusText.innerText = "Scan complete! Check extracted fields below.";
      } else {
        statusText.innerText = "Automatic scan completed. Please verify or manually type reference numbers.";
      }
    }

    // Manual single orientation scan
    async function triggerScanCurrentOrientation() {
      if (!rawLoadedImage) return;
      const statusText = document.getElementById("ocrStatusText");
      statusText.innerText = "Rescanning current view...";
      
      const enhancedCanvas = renderEnhancedCanvas(rawLoadedImage, manualRotationAngle);
      const dataUrl = enhancedCanvas.toDataURL("image/jpeg", 0.9);

      try {
        const { data: { text } } = await Tesseract.recognize(dataUrl, 'eng');
        const result = parseOCRText(text);
        if (result.lims) document.getElementById("reportNo").value = result.lims;
        if (result.ref) document.getElementById("ianRefNo").value = result.ref;
        statusText.innerText = "Rescan complete!";
      } catch (err) {
        statusText.innerText = "Scan failed. Please type details manually.";
      }
    }

    function rotatePreviewManual() {
      manualRotationAngle = (manualRotationAngle + 90) % 360;
      document.getElementById("imagePreview").style.transform = `rotate(${manualRotationAngle}deg)`;
    }

    // Fuzzy Regex Parser to clean common handwriting & OCR mistakes
    function parseOCRText(rawText) {
      let foundLims = "";
      let foundRef = "";

      // Clean line strings
      const lines = rawText.split('\n');

      // 1. Report No. / LIMS No. Search (e.g., 26.0039656, 26.0038976AM01, 26.0.33989)
      const limsRegex = /(?:LIMS|Report|No)[\s\.\:]*([2Z][6B][\.\,\s]*\d[\d\.\,\sOoSsZz]{5,12})/i;
      const directLimsRegex = /\b(2[6b][\.\,]\d[0-9OoSsZz\.\,]{5,12})\b/i;

      let limsMatch = rawText.match(limsRegex) || rawText.match(directLimsRegex);
      if (limsMatch) {
        let cleanLims = (limsMatch[1] || limsMatch[0])
          .replace(/\s+/g, '')
          .replace(/,/g, '.')
          .replace(/O/gi, '0')
          .replace(/S/gi, '5')
          .replace(/Z/gi, '2')
          .replace(/B/gi, '8');
        foundLims = cleanLims;
      }

      // 2. HK Ref No. / IAN Search (e.g., 20260827-009, 265768_2604, 20260826-001)
      const refRegex = /\b([2Z0O][0-9OoSsZz]{7}[\-_/\s][0-9OoSsZzGg]{3,4})\b/;
      const standardIanRegex = /\b(\d{6}_\d{4})\b/;
      const headerRefRegex = /(?:HK\s*Ref|IAN)[\s\.\:]*([A-Z0-9_\-]{7,15})/i;

      let refMatch = rawText.match(refRegex) || rawText.match(standardIanRegex) || rawText.match(headerRefRegex);
      if (refMatch) {
        let cleanRef = (refMatch[1] || refMatch[0])
          .replace(/\s+/g, '')
          .replace(/O/gi, '0')
          .replace(/g/gi, '9')
          .replace(/Z/gi, '2')
          .replace(/S/gi, '5');
        
        if (cleanRef.toUpperCase() !== 'NA') {
          foundRef = cleanRef;
        }
      }

      return { lims: foundLims, ref: foundRef };
    }

    // Live Camera Controls
    async function startLiveCamera(target) {
      currentCameraTarget = target;
      const modal = document.getElementById("cameraModal");
      const video = document.getElementById("videoFeed");

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: { ideal: "environment" } }, 
          audio: false 
        });
        video.srcObject = mediaStream;
        modal.classList.remove("hidden");
      } catch (err) {
        alert("Camera direct access unavailable. Use 'Choose Photo File' to select an image from gallery.");
      }
    }

    function captureFromCamera() {
      const video = document.getElementById("videoFeed");
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg");

      if (currentCameraTarget === 'ocr') {
        const img = new Image();
        img.onload = function() {
          rawLoadedImage = img;
          manualRotationAngle = 0;
          document.getElementById("imagePreview").src = dataUrl;
          document.getElementById("imagePreview").style.transform = "rotate(0deg)";
          document.getElementById("imagePreviewContainer").classList.remove("hidden");
          autoScanAllOrientations(img);
        };
        img.src = dataUrl;
      } else if (currentCameraTarget === 'location') {
        document.getElementById("locationPreview").src = dataUrl;
        document.getElementById("locationPreviewContainer").classList.remove("hidden");
        document.getElementById("locationPhotoName").innerText = "Location Photo Captured";
        locationPhotoBase64 = dataUrl;
      }
      closeCameraModal();
    }

    function closeCameraModal() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById("cameraModal").classList.add("hidden");
    }

    function handleLocationImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      document.getElementById("locationPhotoName").innerText = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById("locationPreview").src = e.target.result;
        document.getElementById("locationPreviewContainer").classList.remove("hidden");
        locationPhotoBase64 = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Save Data to Google Sheet
    async function saveIssue(e) {
      e.preventDefault();
      const category = document.querySelector('input[name="category"]:checked')?.value;
      const ianRefNo = document.getElementById("ianRefNo").value.trim();
      const reportNo = document.getElementById("reportNo").value.trim();
      const remarks = document.getElementById("remarks").value.trim();
      const selectedIssues = Array.from(document.querySelectorAll('input[name="issues"]:checked')).map(cb => cb.value);

      if (selectedIssues.length === 0) {
        alert("Please select at least one issue type.");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting to Google Sheet...";

      const payload = {
        timestamp: new Date().toLocaleString(),
        category,
        ianRefNo,
        reportNo,
        issues: selectedIssues.join(", "),
        remarks,
        photoReference: locationPhotoBase64 ? "Attached" : "None"
      };

      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          alert("Log record submitted successfully to Google Sheet!");
          document.getElementById("issueForm").reset();
          document.getElementById("imagePreviewContainer").classList.add("hidden");
          document.getElementById("locationPreviewContainer").classList.add("hidden");
          document.getElementById("ocrStatus").classList.add("hidden");
        } catch (err) {
          alert("Network error transmitting to Google Sheet.");
        }
      } else {
        alert("Form validated! Replace GOOGLE_SCRIPT_URL in code to write directly to your Google Sheet.");
      }

      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Log Entry";
    }
  </script>
</body>
</html>
