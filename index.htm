<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hohenstein Sample Preparation Team - Test Assignment Issue Log</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <div class="max-w-3xl mx-auto mt-6 px-4">
    <header class="bg-indigo-900 text-white rounded-xl p-6 shadow-md mb-6">
      <h1 class="text-2xl font-bold tracking-tight">Hohenstein Sample Preparation Team</h1>
      <p class="text-indigo-200 text-sm mt-1">Test Assignment Issue Log</p>
    </header>

    <div class="bg-white rounded-xl shadow-md p-6 mb-6">
      <form id="issueForm" class="space-y-6" onsubmit="saveIssue(event)">
        
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Category</label>
          <div class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer border rounded-lg px-4 py-2 hover:bg-slate-50 border-slate-300 flex-1 justify-center font-medium">
              <input type="radio" name="category" value="HG" required class="accent-indigo-600" /> HG
            </label>
            <label class="flex items-center gap-2 cursor-pointer border rounded-lg px-4 py-2 hover:bg-slate-50 border-slate-300 flex-1 justify-center font-medium">
              <input type="radio" name="category" value="TX" class="accent-indigo-600" /> TX
            </label>
          </div>
        </div>

        <div class="border-2 border-dashed border-indigo-200 rounded-xl p-4 bg-indigo-50/40 text-center">
          <label class="block text-sm font-semibold text-indigo-950 mb-1">Scan Test Assignment (TA) Sheet</label>
          <p class="text-xs text-slate-500 mb-3">Upload or take a photo. If needed, click "Rotate 90°" to make text upright before scanning.</p>
          
          <input type="file" id="cameraInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
          
          <div class="flex justify-center gap-2 flex-wrap">
            <button type="button" onclick="startLiveCamera('ocr')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-medium transition shadow-sm">
              📷 Open Live Camera
            </button>
            <button type="button" onclick="document.getElementById('cameraInput').click()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-medium transition shadow-sm">
              📁 Choose Photo File
            </button>
          </div>

          <div id="ocrStatus" class="mt-3 text-xs font-semibold text-indigo-700 hidden">
            <span id="ocrStatusText">Processing scan...</span>
          </div>

          <div id="imagePreviewContainer" class="mt-3 hidden space-y-3">
            <div class="flex justify-center items-center overflow-hidden p-2 bg-slate-200 rounded-lg max-h-64">
              <img id="imagePreview" class="max-h-56 object-contain rounded transition-transform duration-200" alt="TA Sheet Preview" />
            </div>
            
            <div class="flex justify-center gap-2 flex-wrap">
              <button type="button" onclick="rotatePreviewManual()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow-sm">
                🔄 Rotate 90°
              </button>
              <button type="button" onclick="triggerEnhancedScan()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow-sm">
                🔍 Run OCR Scan
              </button>
            </div>
          </div>

          <div id="candidateContainer" class="mt-4 hidden text-left bg-white p-3 rounded-lg border border-slate-200">
            <p class="text-xs font-semibold text-slate-700 mb-2">Detected Candidate Numbers (Tap to fill input):</p>
            <div id="candidateChips" class="flex flex-wrap gap-2"></div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="ianRefNo" class="block text-sm font-medium text-slate-700 mb-1">IAN / HK Ref No.</label>
            <input type="text" id="ianRefNo" placeholder="e.g. 20260827-009 or 265768_2604" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
          <div>
            <label for="reportNo" class="block text-sm font-medium text-slate-700 mb-1">Report No. / LIMS No.</label>
            <input type="text" id="reportNo" placeholder="e.g. 26.0039656" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Select Identified Issues</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <label class="flex items-center gap-2 p-2.5 border rounded-lg border-slate-200 hover:bg-slate-50 cursor-pointer text-sm">
              <input type="checkbox" name="issues" value="Typo" class="rounded text-indigo-600 h-4 w-4" /> Typo
            </label>
            <label class="flex items-center gap-2 p-2.5 border rounded-lg border-slate-200 hover:bg-slate-50 cursor-pointer text-sm">
              <input type="checkbox" name="issues" value="Incorrect information provided" class="rounded text-indigo-600 h-4 w-4" /> Incorrect information provided
            </label>
            <label class="flex items-center gap-2 p-2.5 border rounded-lg border-slate-200 hover:bg-slate-50 cursor-pointer text-sm">
              <input type="checkbox" name="issues" value="Misuse of column" class="rounded text-indigo-600 h-4 w-4" /> Misuse of column
            </label>
            <label class="flex items-center gap-2 p-2.5 border rounded-lg border-slate-200 hover:bg-slate-50 cursor-pointer text-sm">
              <input type="checkbox" name="issues" value="Missing information" class="rounded text-indigo-600 h-4 w-4" /> Missing information
            </label>
            <label class="flex items-center gap-2 p-2.5 border rounded-lg border-slate-200 hover:bg-slate-50 cursor-pointer text-sm sm:col-span-2">
              <input type="checkbox" name="issues" value="Outdated TA used" class="rounded text-indigo-600 h-4 w-4" /> Outdated TA used
            </label>
          </div>
        </div>

        <div class="border border-slate-200 rounded-xl p-4 bg-slate-50">
          <label class="block text-sm font-semibold text-slate-700 mb-1">Issue Location Photo Reference</label>
          <p class="text-xs text-slate-500 mb-3">Attach a photo capturing the issue location.</p>
          
          <input type="file" id="locationImageInput" accept="image/*" class="hidden" onchange="handleLocationImageUpload(event)">
          
          <div class="flex items-center gap-2 flex-wrap">
            <button type="button" onclick="startLiveCamera('location')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium shadow-sm">
              📸 Capture Location Photo
            </button>
            <button type="button" onclick="document.getElementById('locationImageInput').click()" class="bg-slate-600 hover:bg-slate-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium shadow-sm">
              📁 Choose File
            </button>
            <span id="locationPhotoName" class="text-xs text-slate-500 italic">No photo attached</span>
          </div>
          
          <div id="locationPreviewContainer" class="mt-3 hidden">
            <img id="locationPreview" class="max-h-36 rounded-md shadow border" alt="Location Preview" />
          </div>
        </div>

        <div>
          <label for="remarks" class="block text-sm font-medium text-slate-700 mb-1">Additional Remarks</label>
          <textarea id="remarks" rows="2" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-medium py-2.5 rounded-lg transition shadow">
          Submit to Issue Log
        </button>
      </form>
    </div>
  </div>

  <div id="cameraModal" class="fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl overflow-hidden max-w-md w-full p-4 flex flex-col items-center">
      <video id="videoFeed" autoplay playsinline class="w-full h-64 bg-black rounded-lg object-cover mb-4"></video>
      <canvas id="canvas" class="hidden"></canvas>
      <div class="flex gap-4">
        <button onclick="captureFromCamera()" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-medium text-sm">Snap Photo</button>
        <button onclick="closeCameraModal()" class="bg-slate-500 text-white px-4 py-2 rounded-lg font-medium text-sm">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Embedded Google Apps Script Web App Endpoint URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_-hTdSYu_4lBX9RdzjdFiiradqIyP09m16DjBWHCA8MY5D-LUYEY4zwCgoIss78bb/exec";
    
    let locationPhotoBase64 = "";
    let currentCameraTarget = ""; 
    let mediaStream = null;
    let manualRotationAngle = 0;
    let loadedImageObj = null;

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          loadedImageObj = img;
          manualRotationAngle = 0;
          document.getElementById("imagePreview").src = e.target.result;
          document.getElementById("imagePreview").style.transform = "rotate(0deg)";
          document.getElementById("imagePreviewContainer").classList.remove("hidden");
          triggerEnhancedScan();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function rotatePreviewManual() {
      manualRotationAngle = (manualRotationAngle + 90) % 360;
      document.getElementById("imagePreview").style.transform = `rotate(${manualRotationAngle}deg)`;
    }

    function renderOptimizedCanvas(imgElement, rotationAngle) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const maxDim = 1200;
      let width = imgElement.naturalWidth || imgElement.width;
      let height = imgElement.naturalHeight || imgElement.height;

      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      if (rotationAngle === 90 || rotationAngle === 270) {
        canvas.width = height;
        canvas.height = width;
      } else {
        canvas.width = width;
        canvas.height = height;
      }

      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((rotationAngle * Math.PI) / 180);
      ctx.filter = "contrast(200%) grayscale(100%) brightness(110%)";
      ctx.drawImage(imgElement, -width / 2, -height / 2, width, height);

      return canvas;
    }

    async function triggerEnhancedScan() {
      if (!loadedImageObj) return;

      const status = document.getElementById("ocrStatus");
      const statusText = document.getElementById("ocrStatusText");
      status.classList.remove("hidden");
      statusText.innerText = "Scanning text... Please wait.";

      const canvas = renderOptimizedCanvas(loadedImageObj, manualRotationAngle);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.9);

      try {
        const worker = await Tesseract.createWorker('eng');
        const { data: { text } } = await worker.recognize(dataUrl);
        await worker.terminate();

        const parsed = parseOCRTextAdvanced(text);

        if (parsed.lims) document.getElementById("reportNo").value = parsed.lims;
        if (parsed.ref) document.getElementById("ianRefNo").value = parsed.ref;

        renderCandidateChips(parsed.candidates);

        if (parsed.lims || parsed.ref) {
          statusText.innerText = "Scan complete! Reference numbers populated.";
        } else {
          statusText.innerText = "Scan finished. Check detected candidates below or enter manually.";
        }
      } catch (err) {
        statusText.innerText = "OCR extraction error. Please type values manually.";
      }
    }

    function parseOCRTextAdvanced(rawText) {
      if (!rawText) return { lims: "", ref: "", candidates: [] };

      let limsVal = "";
      let refVal = "";
      const candidates = [];
      const tokens = rawText.split(/[\s\n\r]+/);

      tokens.forEach(token => {
        let cleanToken = token.replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9]+$/g, '');
        if (cleanToken.length < 5) return;

        let normalized = cleanToken
          .replace(/O/gi, '0')
          .replace(/Z/gi, '2')
          .replace(/S/gi, '5')
          .replace(/g/g, '9')
          .replace(/B/g, '8');

        if (!limsVal && (normalized.match(/^2[68]\.[\d\.]{5,12}/) || normalized.includes('26.'))) {
          let match = normalized.match(/2[68][\.\,]\d[\d\.\,]{4,12}/);
          if (match) {
            limsVal = match[0].replace(/,/g, '.');
            candidates.push({ type: 'LIMS', val: limsVal });
          }
        }

        if (!refVal) {
          let refMatch = normalized.match(/202\d{5}[-_\/]\d{3,4}/) || 
                         normalized.match(/\d{8}[-_\/]\d{3,4}/) || 
                         normalized.match(/\d{6}_\d{4}/);
          if (refMatch) {
            refVal = refMatch[0];
            candidates.push({ type: 'HK Ref', val: refVal });
          }
        }
      });

      return { lims: limsVal, ref: refVal, candidates };
    }

    function renderCandidateChips(candidates) {
      const container = document.getElementById("candidateContainer");
      const chipsArea = document.getElementById("candidateChips");
      chipsArea.innerHTML = "";

      if (candidates.length === 0) {
        container.classList.add("hidden");
        return;
      }

      container.classList.remove("hidden");
      candidates.forEach(item => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "bg-indigo-100 hover:bg-indigo-200 text-indigo-900 border border-indigo-300 rounded-md px-2.5 py-1 text-xs font-semibold flex items-center gap-1 transition";
        btn.innerText = `+ Use ${item.type}: ${item.val}`;
        btn.onclick = () => {
          if (item.type === 'LIMS') {
            document.getElementById("reportNo").value = item.val;
          } else {
            document.getElementById("ianRefNo").value = item.val;
          }
        };
        chipsArea.appendChild(btn);
      });
    }

    async function startLiveCamera(target) {
      currentCameraTarget = target;
      const modal = document.getElementById("cameraModal");
      const video = document.getElementById("videoFeed");

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: { ideal: "environment" } }, 
          audio: false 
        });
        video.srcObject = mediaStream;
        modal.classList.remove("hidden");
      } catch (err) {
        alert("Camera direct access blocked. Use 'Choose File'.");
      }
    }

    function captureFromCamera() {
      const video = document.getElementById("videoFeed");
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.7);

      if (currentCameraTarget === 'ocr') {
        const img = new Image();
        img.onload = function() {
          loadedImageObj = img;
          manualRotationAngle = 0;
          document.getElementById("imagePreview").src = dataUrl;
          document.getElementById("imagePreview").style.transform = "rotate(0deg)";
          document.getElementById("imagePreviewContainer").classList.remove("hidden");
          triggerEnhancedScan();
        };
        img.src = dataUrl;
      } else if (currentCameraTarget === 'location') {
        document.getElementById("locationPreview").src = dataUrl;
        document.getElementById("locationPreviewContainer").classList.remove("hidden");
        document.getElementById("locationPhotoName").innerText = "Photo Captured";
        locationPhotoBase64 = dataUrl;
      }
      closeCameraModal();
    }

    function closeCameraModal() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById("cameraModal").classList.add("hidden");
    }

    function handleLocationImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      document.getElementById("locationPhotoName").innerText = file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          const maxDim = 1000;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          locationPhotoBase64 = canvas.toDataURL("image/jpeg", 0.7);

          document.getElementById("locationPreview").src = locationPhotoBase64;
          document.getElementById("locationPreviewContainer").classList.remove("hidden");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveIssue(e) {
      e.preventDefault();
      const category = document.querySelector('input[name="category"]:checked')?.value;
      const ianRefNo = document.getElementById("ianRefNo").value.trim();
      const reportNo = document.getElementById("reportNo").value.trim();
      const remarks = document.getElementById("remarks").value.trim();
      const selectedIssues = Array.from(document.querySelectorAll('input[name="issues"]:checked')).map(cb => cb.value);

      if (selectedIssues.length === 0) {
        alert("Please select at least one issue type.");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting to Issue Log...";

      const payload = {
        timestamp: new Date().toLocaleString(),
        category: category,
        ianRefNo: ianRefNo,
        reportNo: reportNo,
        issues: selectedIssues.join(", "),
        remarks: remarks,
        photoData: locationPhotoBase64
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        alert("Submitted successfully! Photo link saved in Google Sheet.");
        document.getElementById("issueForm").reset();
        locationPhotoBase64 = "";
        document.getElementById("locationPhotoName").innerText = "No photo attached";
        document.getElementById("imagePreviewContainer")?.classList.add("hidden");
        document.getElementById("candidateContainer")?.classList.add("hidden");
        document.getElementById("locationPreviewContainer")?.classList.add("hidden");
        document.getElementById("ocrStatus")?.classList.add("hidden");
      } catch (err) {
        alert("Submission failed. Please check network connection.");
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit to Issue Log";
      }
    }
  </script>
</body>
</html>
